<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img" aria-label="Big Bang University — Business. Innovation. Impact.">
  <defs>
    <linearGradient id="f-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7e3ab"/>
      <stop offset="45%" stop-color="#c9962c"/>
      <stop offset="100%" stop-color="#f7e3ab"/>
    </linearGradient>
    <radialGradient id="f-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e4"/>
      <stop offset="35%" stop-color="#f6cf6c"/>
      <stop offset="100%" stop-color="#f6cf6c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="f-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d5a8a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#101a30" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="f-silver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e9edf2"/>
      <stop offset="50%" stop-color="#aeb7c2"/>
      <stop offset="100%" stop-color="#f4f6f8"/>
    </linearGradient>
  </defs>

  <!-- icon, centered top -->
  <g transform="translate(160,10) scale(1)">
    <circle cx="100" cy="100" r="74" fill="none" stroke="url(#f-gold)" stroke-width="1.4" opacity="0.85"/>
    <circle cx="100" cy="100" r="54" fill="url(#f-blue)" stroke="url(#f-gold)" stroke-width="1" opacity="0.9"/>
    <path d="M148,64 A74,74 0 0,1 168,96" fill="none" stroke="url(#f-gold)" stroke-width="1.2" stroke-dasharray="1.5 5" stroke-linecap="round" opacity="0.9"/>
    <line x1="100" y1="24" x2="100" y2="176" stroke="url(#f-gold)" stroke-width="1.3" opacity="0.9"/>
    <line x1="34" y1="100" x2="70" y2="100" stroke="url(#f-gold)" stroke-width="1.1" opacity="0.6"/>
    <circle cx="100" cy="100" r="17" fill="url(#f-core)"/>
    <path d="M100,90 L102.6,98.6 L111,101.2 L102.6,103.8 L100,112.4 L97.4,103.8 L89,101.2 L97.4,98.6 Z" fill="url(#f-gold)"/>
    <circle cx="100" cy="24" r="3.4" fill="url(#f-gold)"/>
    <circle cx="100" cy="176" r="3.4" fill="url(#f-gold)"/>
    <circle cx="168" cy="96" r="3" fill="url(#f-gold)"/>
    <circle cx="34" cy="100" r="2.6" fill="url(#f-gold)"/>
    <circle cx="140" cy="146" r="2.6" fill="url(#f-gold)"/>
  </g>

  <!-- wordmark, centered -->
  <text x="260" y="255" text-anchor="middle" font-family="'Montserrat','Arial Black',Arial,sans-serif" font-weight="800" font-size="50" letter-spacing="2">
    <tspan fill="url(#f-silver)">BIG B</tspan><tspan fill="url(#f-gold)" font-size="56">&#923;</tspan><tspan fill="url(#f-silver)">NG</tspan>
  </text>
  <text x="260" y="292" text-anchor="middle" font-family="'Montserrat',Arial,sans-serif" font-weight="600" font-size="25" letter-spacing="10" fill="url(#f-gold)">UNIVERSITY</text>

  <!-- divider -->
  <line x1="140" y1="311" x2="238" y2="311" stroke="url(#f-gold)" stroke-width="1" opacity="0.7"/>
  <path d="M260,306 L263,311 L260,316 L257,311 Z" fill="url(#f-gold)"/>
  <line x1="282" y1="311" x2="380" y2="311" stroke="url(#f-gold)" stroke-width="1" opacity="0.7"/>

  <!-- slogan -->
  <text x="260" y="337" text-anchor="middle" font-family="Arial,sans-serif" font-weight="500" font-size="14" letter-spacing="4" fill="#c7cdd8">BUSINESS. INNOVATION. IMPACT.</text>
</svg>
