<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 160" role="img" aria-label="Big Bang University">
  <defs>
    <linearGradient id="w-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7e3ab"/>
      <stop offset="45%" stop-color="#c9962c"/>
      <stop offset="100%" stop-color="#f7e3ab"/>
    </linearGradient>
    <radialGradient id="w-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e4"/>
      <stop offset="35%" stop-color="#f6cf6c"/>
      <stop offset="100%" stop-color="#f6cf6c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="w-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d5a8a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#101a30" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="w-silver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e9edf2"/>
      <stop offset="50%" stop-color="#aeb7c2"/>
      <stop offset="100%" stop-color="#f4f6f8"/>
    </linearGradient>
  </defs>

  <!-- icon mark, scaled to ~120px, centered vertically -->
  <g transform="translate(0,20) scale(0.6)">
    <circle cx="100" cy="100" r="74" fill="none" stroke="url(#w-gold)" stroke-width="1.4" opacity="0.85"/>
    <circle cx="100" cy="100" r="54" fill="url(#w-blue)" stroke="url(#w-gold)" stroke-width="1" opacity="0.9"/>
    <path d="M148,64 A74,74 0 0,1 168,96" fill="none" stroke="url(#w-gold)" stroke-width="1.2" stroke-dasharray="1.5 5" stroke-linecap="round" opacity="0.9"/>
    <line x1="100" y1="24" x2="100" y2="176" stroke="url(#w-gold)" stroke-width="1.3" opacity="0.9"/>
    <line x1="34" y1="100" x2="70" y2="100" stroke="url(#w-gold)" stroke-width="1.1" opacity="0.6"/>
    <circle cx="100" cy="100" r="17" fill="url(#w-core)"/>
    <path d="M100,90 L102.6,98.6 L111,101.2 L102.6,103.8 L100,112.4 L97.4,103.8 L89,101.2 L97.4,98.6 Z" fill="url(#w-gold)"/>
    <circle cx="100" cy="24" r="3.4" fill="url(#w-gold)"/>
    <circle cx="100" cy="176" r="3.4" fill="url(#w-gold)"/>
    <circle cx="168" cy="96" r="3" fill="url(#w-gold)"/>
    <circle cx="34" cy="100" r="2.6" fill="url(#w-gold)"/>
    <circle cx="140" cy="146" r="2.6" fill="url(#w-gold)"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(140,0)">
    <text x="0" y="66" font-family="'Montserrat','Arial Black',Arial,sans-serif" font-weight="800" font-size="52" letter-spacing="2">
      <tspan fill="url(#w-silver)">BIG B</tspan><tspan fill="url(#w-gold)" font-size="58">&#923;</tspan><tspan fill="url(#w-silver)">NG</tspan>
    </text>
    <text x="2" y="102" font-family="'Montserrat',Arial,sans-serif" font-weight="600" font-size="26" letter-spacing="9" fill="url(#w-gold)">UNIVERSITY</text>
  </g>
</svg>
