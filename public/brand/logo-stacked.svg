<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 480" role="img" aria-label="Big Bang University — Business. Innovation. Impact.">
  <defs>
    <linearGradient id="bbu-gold-st" x1="70" y1="20" x2="350" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f3e3b8"/>
      <stop offset="55%" stop-color="#c9a961"/>
      <stop offset="100%" stop-color="#8f6f2e"/>
    </linearGradient>
    <radialGradient id="bbu-navy-st" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1b2a4a"/>
      <stop offset="100%" stop-color="#0c1424"/>
    </radialGradient>
    <radialGradient id="bbu-core-st" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e0"/>
      <stop offset="45%" stop-color="#f2cf7d" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#f2cf7d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bbu-silver-st" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f4f3ef"/>
      <stop offset="100%" stop-color="#c7cdd8"/>
    </linearGradient>
  </defs>

  <!-- mark, centered top -->
  <g transform="translate(210,150)">
    <circle r="130" fill="none" stroke="url(#bbu-gold-st)" stroke-width="2" opacity="0.85"/>
    <circle r="104" fill="url(#bbu-navy-st)" stroke="url(#bbu-gold-st)" stroke-width="1.5"/>
    <path d="M92 -55 A130 130 0 0 1 108 -10" fill="none" stroke="url(#bbu-gold-st)" stroke-width="2" stroke-dasharray="1.5 7" stroke-linecap="round"/>
    <g fill="url(#bbu-gold-st)">
      <circle cx="0" cy="-130" r="6.5"/>
      <circle cx="0" cy="130" r="6.5"/>
      <circle cx="108" cy="-10" r="5.5"/>
      <circle cx="-99" cy="46" r="4.5"/>
    </g>
    <circle r="50" fill="url(#bbu-core-st)"/>
    <path d="M0 -36 L9 -9 L36 0 L9 9 L0 36 L-9 9 L-36 0 L-9 -9 Z" fill="url(#bbu-gold-st)"/>
  </g>

  <!-- wordmark -->
  <g font-family="'Sora',Arial,sans-serif" text-anchor="middle">
    <text x="210" y="345" font-weight="800" font-size="54" letter-spacing="1" fill="url(#bbu-silver-st)">BIG B<tspan fill="url(#bbu-gold-st)" font-size="58">&#923;</tspan>NG</text>
    <text x="210" y="392" font-weight="600" font-size="30" letter-spacing="12" fill="url(#bbu-gold-st)">UNIVERSITY</text>
  </g>

  <!-- divider -->
  <line x1="120" y1="412" x2="192" y2="412" stroke="url(#bbu-gold-st)" stroke-width="1" opacity="0.7"/>
  <path d="M210 406 L215 412 L210 418 L205 412 Z" fill="url(#bbu-gold-st)"/>
  <line x1="228" y1="412" x2="300" y2="412" stroke="url(#bbu-gold-st)" stroke-width="1" opacity="0.7"/>

  <!-- tagline -->
  <text x="210" y="444" text-anchor="middle" font-family="Arial,sans-serif" font-weight="500" font-size="16" letter-spacing="4.5" fill="#a7abb4">BUSINESS. INNOVATION. IMPACT.</text>
</svg>
